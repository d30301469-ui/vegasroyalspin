# Apache vhost örneği — admin.vegasroyalspin.com (backend + admin API + member API)
# aaPanel: Website → site → Config dosyasına uyarlayın.
# Member API ayrı bir api.* subdomain KULLANMAZ; /api/v2 bu host üzerinden servis edilir.
# Cloudflare: SSL Flexible, aaPanel Force HTTPS KAPAT.

<VirtualHost *:80>
    ServerName admin.vegasroyalspin.com
    DocumentRoot /www/wwwroot/admin.vegasroyalspin.com

    <Directory /www/wwwroot/admin.vegasroyalspin.com>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /www/wwwlogs/admin.vegasroyalspin.com-error_log
    CustomLog /www/wwwlogs/admin.vegasroyalspin.com-access_log combined
</VirtualHost>
