name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -eu
            cd /www/wwwroot/vegasroyalspin.com
            git fetch origin main
            git reset --hard origin/main
            DEPLOYED_SHA="$(git rev-parse HEAD)"
            EXPECTED_SHA="${{ github.sha }}"
            if [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
              echo "Deploy verification failed: expected $EXPECTED_SHA, got $DEPLOYED_SHA"
              exit 1
            fi
            echo "Deploy verified: $DEPLOYED_SHA"
            php tools/update_menu_bgaming_v2.php || true
            php tools/update_tabbar_v1.php || true
            php deploy/aapanel/remove-legacy-provider-integration.php || true
            php deploy/aapanel/remove-gamingsoft-integration.php
            php -r "if(function_exists('opcache_reset')) opcache_reset(); echo 'opcache cleared\n';"

      # Cloudflare caches HTML and query-versioned assets as separate variants.
      # Purging only the unversioned PWA URLs leaves stale page/JS variants in
      # production after deploys, so clear the zone after the SHA is verified.
      # No-op until CLOUDFLARE_API_TOKEN + CLOUDFLARE_ZONE_ID secrets are set.
      - name: Purge Cloudflare edge cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare secrets not configured, skipping purge."
            exit 0
          fi
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
